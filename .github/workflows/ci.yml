name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore 'c#/server/server.sln'

      - name: Build backend
        run: dotnet build 'c#/server/server.sln' --no-restore --configuration Release

      - name: Test backend
        run: dotnet test 'c#/server/server.sln' --no-build --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
