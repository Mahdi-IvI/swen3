services:
  api:
    build:
      context: ./c#/server
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=dsm;Username=dsmuser;Password=dsmpassword
      Jwt__SecretKey: MahdiAndMarkoandKenansSecretKey!@!§$%&/()=?
    ports:
      - "5176:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: dsm_postgres

    environment:
      POSTGRES_DB: dsm
      POSTGRES_USER: dsmuser
      POSTGRES_PASSWORD: dsmpassword

    ports:
      - "5433:5432"

    volumes:
      - dsm_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsmuser -d dsm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dsm_data:
