services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  api:
    build:
      context: ./c#/server
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: dsmuser
      RabbitMQ__Password: dsmpassword
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=dsm;Username=dsmuser;Password=dsmpassword
      Jwt__SecretKey: "${JWT_SECRET}"
    ports:
      - "5176:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: dsmuser
      RABBITMQ_DEFAULT_PASS: dsmpassword
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocr-worker:
    build:
      context: ./c#/server
      dockerfile: OcrWorker/Dockerfile
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: dsmuser
      RabbitMQ__Password: dsmpassword
    depends_on:
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: dsm_postgres

    environment:
      POSTGRES_DB: dsm
      POSTGRES_USER: dsmuser
      POSTGRES_PASSWORD: dsmpassword

    ports:
      - "5433:5432"

    volumes:
      - dsm_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsmuser -d dsm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dsm_data:
  rabbitmq_data:
